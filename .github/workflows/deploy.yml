name: Build & deploy (Cloudflare Workers)

on:
  push:
    branches: [main]
  pull_request:
  # Codzienny rebuild – nowe artykuły z Aura CMS trafiają na stronę bez ręcznej akcji.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  # Webhook z Supabase (Database Webhook -> GitHub repository_dispatch) publikuje artykuł od razu.
  repository_dispatch:
    types: [cms-update]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      # PR: tylko sprawdzamy, że konfiguracja wranglera jest poprawna.
      - if: github.event_name == 'pull_request'
        run: npx wrangler deploy --dry-run

      # main / harmonogram / ręcznie / webhook: prawdziwy deploy.
      - if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
