name: Build & deploy (GitHub Pages)

on:
  push:
    branches: [main]
  # Codzienny rebuild – nowe artykuły z Aura CMS trafiają na stronę bez ręcznej akcji.
  schedule:
    - cron: '17 4 * * *'
  # Ręczne uruchomienie z zakładki Actions.
  workflow_dispatch:
  # Webhook z Supabase (Database Webhook -> GitHub repository_dispatch) publikuje artykuł od razu.
  repository_dispatch:
    types: [cms-update]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Włącza Pages w trybie „GitHub Actions” (jednorazowo), jeśli jeszcze nie jest.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
